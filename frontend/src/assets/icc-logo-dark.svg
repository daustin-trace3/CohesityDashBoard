<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 67" width="300" height="67" role="img" aria-label="Infrastructure Command Center">
  <defs>
    <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18222C"/>
      <stop offset="1" stop-color="#0B1015"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82C957"/>
      <stop offset="1" stop-color="#54932D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- mark: hexagon frame with a central node and three spokes -->
  <g transform="translate(33.5 33.5)">
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="url(#hexFill)" stroke="url(#hexStroke)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="0,-21 18.2,-10.5 18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5" fill="none" stroke="#6CB33F" stroke-opacity="0.28" stroke-width="1"/>
    <g stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-5" x2="0" y2="-18"/>
      <line x1="4.3" y1="2.5" x2="15.6" y2="9"/>
      <line x1="-4.3" y1="2.5" x2="-15.6" y2="9"/>
    </g>
    <g fill="#60A5FA" filter="url(#glow)">
      <circle cx="0" cy="-18" r="2.4"/>
      <circle cx="15.6" cy="9" r="2.4"/>
      <circle cx="-15.6" cy="9" r="2.4"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#0B1015" stroke="#6CB33F" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.6" fill="#82C957" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, InterVariable, 'Segoe UI', Roboto, sans-serif">
    <text x="76" y="45" fill="#E8EDF2" font-size="34" font-weight="800" letter-spacing="-1">ICC</text>
    <line x1="146" y1="19" x2="146" y2="48" stroke="#6CB33F" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <text x="156" y="31" fill="#E8EDF2" font-size="12" font-weight="700" letter-spacing="2.4">INFRASTRUCTURE</text>
    <text x="156" y="46" fill="#6CB33F" font-size="12" font-weight="600" letter-spacing="2.4">COMMAND CENTER</text>
  </g>
</svg>
