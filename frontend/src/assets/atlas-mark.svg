<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="120" height="120" role="img" aria-label="Atlas">
  <defs>
    <linearGradient id="amRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82C957"/>
      <stop offset="1" stop-color="#54932D"/>
    </linearGradient>
    <linearGradient id="amStarL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82C957"/>
      <stop offset="1" stop-color="#6CB33F"/>
    </linearGradient>
    <linearGradient id="amStarD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54932D"/>
      <stop offset="1" stop-color="#3E6F22"/>
    </linearGradient>
    <radialGradient id="amGlobe" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#18222C"/>
      <stop offset="1" stop-color="#0B1015"/>
    </radialGradient>
    <filter id="amGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- globe -->
  <circle r="44" fill="url(#amGlobe)" stroke="url(#amRing)" stroke-width="2.5"/>
  <g fill="none" stroke="#6CB33F" stroke-opacity="0.3" stroke-width="1">
    <ellipse rx="20" ry="44"/>
    <ellipse rx="36" ry="44"/>
    <ellipse rx="44" ry="17"/>
    <ellipse rx="44" ry="34"/>
    <line x1="-44" y1="0" x2="44" y2="0"/>
    <line x1="0" y1="-44" x2="0" y2="44"/>
  </g>

  <!-- compass: diagonal short points (dark), cardinal long points (light and dark halves) -->
  <g transform="rotate(45)">
    <polygon points="0,-24 4,-4 24,0 4,4 0,24 -4,4 -24,0 -4,-4" fill="#60A5FA" opacity="0.85"/>
  </g>
  <polygon points="0,-38 5.5,-5.5 0,0" fill="url(#amStarL)"/>
  <polygon points="0,-38 -5.5,-5.5 0,0" fill="url(#amStarD)"/>
  <polygon points="38,0 5.5,5.5 0,0" fill="url(#amStarD)"/>
  <polygon points="38,0 5.5,-5.5 0,0" fill="url(#amStarL)"/>
  <polygon points="0,38 -5.5,5.5 0,0" fill="url(#amStarL)"/>
  <polygon points="0,38 5.5,5.5 0,0" fill="url(#amStarD)"/>
  <polygon points="-38,0 -5.5,-5.5 0,0" fill="url(#amStarD)"/>
  <polygon points="-38,0 -5.5,5.5 0,0" fill="url(#amStarL)"/>

  <!-- nodes on the ring -->
  <g fill="#60A5FA" filter="url(#amGlow)">
    <circle cx="0" cy="-44" r="3.4"/>
    <circle cx="44" cy="0" r="3.4"/>
    <circle cx="0" cy="44" r="3.4"/>
    <circle cx="-44" cy="0" r="3.4"/>
  </g>

  <!-- hub -->
  <circle r="7" fill="#0B1015" stroke="#6CB33F" stroke-width="2"/>
  <circle r="2.6" fill="#82C957" filter="url(#amGlow)"/>
</svg>
